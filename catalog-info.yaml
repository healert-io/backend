apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: healert-backend
  description: >
    Healert Backend — self-hosted FastAPI backend for the Healert
    Friction Intelligence Platform. Receives friction events from the
    Go agent, calculates exponential decay scores, and serves data to
    the Backstage plugin via REST API.
  annotations:
    github.com/project-slug: healert-io/backend
    backstage.io/techdocs-ref: dir:.
  tags:
    - python
    - fastapi
    - platform-engineering
    - friction-intelligence
spec:
  type: service
  lifecycle: production
  owner: healert
  dependsOn:
    - component:default/healert-agent
  providesApis:
    - healert-backend-api
